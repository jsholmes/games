<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Games">
<meta name="theme-color" content="#fff8ec">
<link rel="apple-touch-icon" href="img/cat-attack.png">
<link rel="icon" href="img/cat-attack.png">
<title>Kit &amp; Addie's Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* One bright, paper-like look for both themes: this is a kids' page, not an app chrome. */
:root{
  --bg:#fff8ec; --ink:#2f2622; --soft:#6d5d55; --card:#ffffff; --line:#f0e0cc;
  --kit:#d8304f; --kit-bg:#ffe9ec; --addie:#7b4fd6; --addie-bg:#efe8ff;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;padding:
  calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px))
  calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:1000px;margin:0 auto}
h1{font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1.05;margin:4px 0 24px;text-align:center}
h1 .k{color:var(--kit)} h1 .a{color:var(--addie)}
section{border-radius:28px;padding:18px 18px 22px;margin:0 0 24px}
section.kit{background:var(--kit-bg)} section.addie{background:var(--addie-bg)}
h2{font-weight:800;font-size:clamp(28px,5vw,40px);margin:0 4px 14px;line-height:1.1;display:flex;align-items:center;gap:12px}
.kit h2{color:var(--kit)} .addie h2{color:var(--addie)}
.badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:28px;flex:none}
.kit .badge{background:var(--kit)} .addie .badge{background:var(--addie)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
a.game{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:22px;overflow:hidden;
  border:3px solid var(--line);transition:transform .12s ease,box-shadow .12s ease;box-shadow:0 4px 0 var(--line)}
a.game:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--line)}
a.game:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.kit a.game:focus-visible{outline:4px solid var(--kit);outline-offset:3px}
.addie a.game:focus-visible{outline:4px solid var(--addie);outline-offset:3px}
a.game img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.label{padding:10px 14px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-weight:800;font-size:24px;line-height:1.1}
.play{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.kit .play{background:var(--kit)} .addie .play{background:var(--addie)}
.play svg{width:20px;height:20px;margin-left:3px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.name{font-size:19px}}
.empty{font-size:22px;color:var(--soft);margin:4px 6px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1><span class="k">Kit</span> &amp; <span class="a">Addie</span>'s Games</h1>
  <section class="kit" aria-labelledby="kit-h"><h2 id="kit-h"><span class="badge" aria-hidden="true">K</span>Kit's games</h2><div class="grid" id="kit"></div></section>
  <section class="addie" aria-labelledby="addie-h"><h2 id="addie-h"><span class="badge" aria-hidden="true">A</span>Addie's games</h2><div class="grid" id="addie"></div></section>
</main>
<script>
// To add a game: add a line to the right list. "url" is where the game lives, "img" is a square picture.
const GAMES = {
  kit: [
    { name: "Cat Attack",  url: "https://jsholmes.github.io/cat-attack/",       img: "img/cat-attack.png" },
    { name: "Dino Attack", url: "https://jsholmes.github.io/cat-attack/dinos/", img: "img/dino-attack.png" },
  ],
  addie: [
    { name: "Best Tree Friends", url: "https://jsholmes.github.io/best-tree-friends/", img: "img/best-tree-friends.png" },
  ],
};
const PLAY = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2.5v15l13-7.5z" fill="currentColor"/></svg>';
for (const who of Object.keys(GAMES)) {
  const box = document.getElementById(who);
  if (!GAMES[who].length) { box.outerHTML = '<p class="empty">Games coming soon!</p>'; continue; }
  for (const g of GAMES[who]) {
    const a = document.createElement("a");
    a.className = "game"; a.href = g.url;
    a.innerHTML = `<img alt="" src="${g.img}"><div class="label"><span class="name"></span><span class="play">${PLAY}</span></div>`;
    a.querySelector(".name").textContent = g.name;
    box.appendChild(a);
  }
}
</script>
</body>
</html>
